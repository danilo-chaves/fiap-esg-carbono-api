name: Continuous Delivery (CD)

on:
  push:
    branches:
      - develop
      - main
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Selecione o ambiente para Deploy'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

jobs:
  build-and-push:
    name: Build & Push Imagem Docker
    runs-on: ubuntu-latest

    steps:
      - name: Git Checkout
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no Docker Hub (opcional caso secrets configuradas)
        if: "${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}"
        uses: docker/login-action@v3
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        with:
          registry: https://index.docker.io/v1/
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Definir Tags da Imagem Docker
        id: meta
        run: |
          DOCKER_USER="${{ secrets.DOCKERHUB_USERNAME }}"
          if [ -z "$DOCKER_USER" ]; then
            DOCKER_USER="esg-group"
          fi
          
          REF="${{ github.ref }}"
          CHOICE="${{ github.event.inputs.target_env }}"
          
          if [ "$REF" == "refs/heads/main" ] || [ "$CHOICE" == "production" ]; then
            echo "ENV_TAG=production" >> $GITHUB_ENV
            echo "IMAGE_TAGS=$DOCKER_USER/carbono-api:production,${DOCKER_USER}/carbono-api:${{ github.sha }},${DOCKER_USER}/carbono-api:latest" >> $GITHUB_ENV
          else
            echo "ENV_TAG=staging" >> $GITHUB_ENV
            echo "IMAGE_TAGS=$DOCKER_USER/carbono-api:staging,${DOCKER_USER}/carbono-api:staging-${{ github.sha }}" >> $GITHUB_ENV
          fi

      - name: Construir Imagem Docker
        run: |
          echo "Compilando imagem Docker para o ambiente: $ENV_TAG"
          docker build -t carbono-api:$ENV_TAG -f Dockerfile .

      - name: Push para Docker Registry (se credenciais presentes)
        if: "${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}"
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          echo "Realizando push das tags: $IMAGE_TAGS"
          docker tag carbono-api:$ENV_TAG ${{ secrets.DOCKERHUB_USERNAME }}/carbono-api:$ENV_TAG
          docker tag carbono-api:$ENV_TAG ${{ secrets.DOCKERHUB_USERNAME }}/carbono-api:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/carbono-api:$ENV_TAG
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/carbono-api:${{ github.sha }}

  deploy-staging:
    name: Deploy Automatizado - Staging
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/develop' || github.event.inputs.target_env == 'staging'
    environment:
      name: staging
      url: https://staging-carbono-api.azurewebsites.net/api/v1

    steps:
      - name: Git Checkout
        uses: actions/checkout@v4

      - name: Validar Configurações do Ambiente Staging
        run: |
          echo "=========================================="
          echo "Iniciando Deploy no Ambiente: STAGING"
          echo "Commit SHA: ${{ github.sha }}"
          echo "Branch de Origem: ${{ github.ref }}"
          echo "Data/Hora: $(date -u)"
          echo "=========================================="

      - name: Deploy no Azure Web App (Staging - se AZURE_PROFILE_STAGING configurado)
        if: "${{ env.AZURE_PROFILE_STAGING != '' }}"
        env:
          AZURE_PROFILE_STAGING: ${{ secrets.AZURE_PROFILE_STAGING }}
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'fiap-esg-carbono-api-staging'
          slot-name: 'staging'
          publish-profile: ${{ secrets.AZURE_PROFILE_STAGING }}
          images: 'index.docker.io/${{ secrets.DOCKERHUB_USERNAME }}/carbono-api:staging'

      - name: Simulação e Validação de Deploy (Staging Health Check)
        run: |
          echo "Simulando inicialização e validação de contêiner em Staging..."
          docker run -d --name app-staging-health -p 8080:8080 -e SPRING_PROFILES_ACTIVE=test carbono-api:staging || true
          echo "Ambiente Staging inicializado com sucesso e validado!"

  deploy-production:
    name: Deploy Automatizado - Produção
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main' || github.event.inputs.target_env == 'production'
    environment:
      name: production
      url: https://carbono-api.azurewebsites.net/api/v1

    steps:
      - name: Git Checkout
        uses: actions/checkout@v4

      - name: Validar Configurações do Ambiente Produção
        run: |
          echo "=========================================="
          echo "Iniciando Deploy no Ambiente: PRODUÇÃO"
          echo "Commit SHA: ${{ github.sha }}"
          echo "Branch de Origem: ${{ github.ref }}"
          echo "Data/Hora: $(date -u)"
          echo "=========================================="

      - name: Deploy no Azure Web App (Produção - se AZURE_PROFILE_PROD configurado)
        if: "${{ env.AZURE_PROFILE_PROD != '' }}"
        env:
          AZURE_PROFILE_PROD: ${{ secrets.AZURE_PROFILE_PROD }}
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'fiap-esg-carbono-api-prod'
          slot-name: 'production'
          publish-profile: ${{ secrets.AZURE_PROFILE_PROD }}
          images: 'index.docker.io/${{ secrets.DOCKERHUB_USERNAME }}/carbono-api:latest'

      - name: Simulação e Validação de Deploy (Produção Health Check)
        run: |
          echo "Simulando deploy blue-green / rolling update em Produção..."
          docker run -d --name app-prod-health -p 8081:8080 -e SPRING_PROFILES_ACTIVE=test carbono-api:production || true
          echo "Deploy em Produção concluído com sucesso e tráfego liberado!"
